name: Build
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Build ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install Ubuntu Prerequisites
        run: |
          sudo apt-get update || true
          sudo apt-get install build-essential
          sudo apt-get install libglib2.0 libxml2-dev libpcap-dev librrd-dev redis-server libsqlite3-dev libhiredis-dev libmaxminddb-dev libcurl4-openssl-dev libzmq3-dev git libjson-c-dev
      - name: Build nDPI
        # Upstream clones nDPI's dev branch unpinned, so ntopng only ever builds
        # against whatever nDPI HEAD is that hour. This fork is pinned to ntopng
        # 62ea3d0d (2026-09-05 08:49Z) and nDPI 61337dad12 "Reworked code to split
        # flow definition in core and metadata" landed at 13:48Z the same day,
        # taking risk/protos/host_server_name off struct ndpi_flow_struct; ntopng
        # adapted 14 minutes later in 17d4881399 "Fixes due to nDPI changes",
        # which is newer than our pin. 4cae778e is nDPI dev HEAD as of the pinned
        # ntopng commit, so this restores the pair that upstream last built green.
        # Drop the checkout if the ntopng pin ever moves past 17d4881399.
        run: |
          git clone https://github.com/ntop/nDPI.git; cd nDPI; git checkout -q 4cae778e7e8f846b34f11d4f8392504cdebd3db8; ./autogen.sh; ./configure --with-only-libndpi --disable-shared; make -j $(nproc); cd ..
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build
        run: make -j $(nproc)

